name: build-oled

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASSET: 2.16.0_${{ github.ref_name }}_Amiibotool.zip
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build OLED firmware (signed OTA)
        run: |
          docker run --rm -v "$PWD":/work -w /work solosky/nrf52-sdk:latest \
            bash -lc 'git config --global --add safe.directory /work && cd fw && make all BOARD=OLED RELEASE=1'

      - name: Fix build output permissions
        run: sudo chown -R "$(id -u):$(id -g)" fw/_build

      - name: Rename OTA package
        run: cp fw/_build/pixjs_ota_v1.zip "$ASSET"

      - name: Upload build artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: Amiibotool-2.16.0_${{ github.ref_name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Publish Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
